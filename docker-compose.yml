services:
  postgres:
    image: postgres:16-alpine
    container_name: emissor_nfe_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-emissor_nfe_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres123}
      TZ: America/Sao_Paulo
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-emissor_nfe_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
